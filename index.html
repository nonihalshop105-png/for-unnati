<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Unnati ❤️</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>

<body>
    <div id="intro">

        <h1 id="typing"></h1>

        <button id="startBtn">Begin Our Journey ❤️</button>

    </div>

    <div class="hero" id="mainSite">

        <div id="stars"></div>

        <h1>For Unnati ❤️</h1>

        <p>
        Every love story begins with a single moment...
        </p>

        <a href="#chapter1">

        <button>
        Begin Our Story ❤️
        </button>

        </a>

    </div>
<section id="chapter1" class="chapter reveal">

    <div class="story-container">

        <h2 class="story-title">
            Our Beginning
        </h2>

    <p id="storyText"></p>

    </div>

</section>
<section id="chapter2" class="memory-scene">

    <h1 class="memory-title">
        Moments I Never Want To Forget
    </h1>

    <div class="memory-card">

        <img
            id="memoryImage"
            src="images/photo1.jpeg"
        >

        <p id="memoryCaption">

            The smile that changed everything ❤️

        </p>

    </div>

</section>
<section id="letters" class="letter-section">

    <div class="letter-paper">

        <h2 id="letterTitle"></h2>

        <div id="letterText"></div>

        <div class="signature">

            — Rishabh❤️

        </div>

    </div>

</section>
<section id="counterSection" class="counter-section">

    <h2>❤️ Our Journey</h2>

    <div id="loveCounter"></div>

</section>
<section id="ending" class="ending-scene">

    <h1 id="endingText"></h1>

</section>
<section id="finalQuestion" class="final-question">

    <h1 id="questionText">
        Will you keep writing<br>
        the rest of this story<br>
        with me?
    </h1>

    <button id="yesBtn">
        ❤️ Yes... Always
    </button>

</section>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/gsap.min.js"></script>
<script src="JS/script.js"></script>
<div id="cinemaFade"></div>
</body>

</html>
